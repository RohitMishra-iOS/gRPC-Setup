# render.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — deploys the gRPC + gRPC-Web proxy server as a single
# Web Service using Docker.
#
# Deploy steps:
#   1. Push the `server/` folder (or whole repo) to GitHub / GitLab.
#   2. In Render dashboard → New → Blueprint → point to this repo.
#   3. Render reads this file and creates the service automatically.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: grpc-status-server
    runtime: docker
    # Path to the Dockerfile, relative to the repo root.
    # If you push only the server/ folder as its own repo, change to: .
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server

    # Render injects PORT automatically — our server reads it as the
    # gRPC-Web proxy port (public). No need to set it here.

    # Health check — Render pings this to confirm the container is up.
    # GET /health returns 200 with {"status":"ok"}.
    healthCheckPath: /health

    envVars:
      # Internal gRPC server port — NOT exposed publicly, only used inside
      # the container (native gRPC; the public port serves gRPC-Web).
      - key: GRPC_PORT
        value: "50051"

      - key: GRPC_HOST
        value: "0.0.0.0"

      # Set this to your frontend domain(s) in production, e.g.:
      # https://yourapp.onrender.com,https://yourapp.com
      # Leave as * for open access during development.
      - key: ALLOWED_ORIGINS
        value: "*"

      # MongoDB Atlas — required for persisting incoming event batches.
      # sync: false → Render prompts for the value in the dashboard instead
      # of storing the secret in this file. Set these under the service's
      # Environment tab after the Blueprint is created.
      - key: MONGODB_URI
        sync: false

      - key: MONGODB_DB_NAME
        value: "grpc_status"

      # ── DM SDK 2.0 (Crashlytics / Remote Config / Performance / Messaging) ──
      # API keys the iOS SDK sends as x-api-key. Comma-separated; "app_id:key" scopes a key to
      # one app. Leave unset only for local development (calls are then unauthenticated).
      - key: DM_API_KEYS
        sync: false

      # Admin API (/admin/...) key. Unset = admin API disabled.
      - key: DM_ADMIN_KEY
        sync: false

      # Days to keep crash / performance / push documents (TTL). 0 = forever.
      - key: DM_RETENTION_DAYS
        value: "90"

      # Optional: Slack-compatible webhook for new-issue / regression / velocity crash alerts.
      - key: DM_ALERT_WEBHOOK_URL
        sync: false

      # APNs token auth for sending pushes (Apple Developer → Keys → a key with APNs enabled).
      # APNS_KEY_P8 = full contents of the .p8 file (newlines may be written as \n).
      - key: APNS_KEY_P8
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
