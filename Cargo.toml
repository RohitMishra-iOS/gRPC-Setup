[package]
name = "grpc-status-server"
version = "2.0.0"
edition = "2021"
description = "DM SDK backend: analytics, crashlytics, remote config, performance, messaging (gRPC + gRPC-Web)"

[dependencies]
addr2line = "0.24"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
futures-util = { version = "0.3", features = ["io"] }
hex = "0.4"
jsonwebtoken = "9"
mongodb = "3"
object = "0.36"
percent-encoding = "2"
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
strip = true
